services:
  qbittorrent-SLo:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent-SLo
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - WEBUI_PORT=8084
      - TORRENTING_PORT=6881
    volumes:
      - /Docker/qbittorrent-SLo/config:/config
      - /nas/Torrents/SLo-torrents:/nas/Torrents #optional
    ports:
      - 8084:8084
    restart: unless-stopped

